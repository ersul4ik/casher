# Render blueprint. Values marked sync: false are entered by hand in the dashboard.
services:
  - type: web
    name: casher-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      # BASE_URL is not listed on purpose: Render sets RENDER_EXTERNAL_URL itself and the
      # bot falls back to it, so a service created in a new region works before anyone
      # types its address in. Set BASE_URL by hand only behind a custom domain.
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DEFAULT_CURRENCY
        value: KGS
      - key: DEFAULT_TZ_MINUTES
        value: "360"
